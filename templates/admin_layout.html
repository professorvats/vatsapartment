{{define "admin_header"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{.Title}} — Vats Apartment Admin</title>
<link rel="stylesheet" href="/static/app-tailwind.css">
<link rel="icon" href="/static/favicon.ico">
<style>
  .sidebar { transition: transform 0.25s ease; }
  .overlay { transition: opacity 0.25s ease; }
  @media (max-width: 1023px) {
    .sidebar { transform: translateX(-50%); }
    .sidebar.open { transform: translateX(0); }
    .overlay { opacity: 0; pointer-events: none; }
    .overlay.show { opacity: 1; pointer-events: auto; }
  }
</style>
</head>
<body class="bg-background text-on-surface min-h-screen">

<!-- Mobile overlay -->
<div id="overlay" class="overlay fixed inset-0 bg-black/50 z-30 lg:hidden" onclick="closeSidebar()"></div>

<!-- Sidebar -->
<aside id="sidebar" class="sidebar fixed top-0 left-0 h-full w-64 bg-primary z-40 flex flex-col overflow-y-auto">
  <div class="px-5 py-4 border-b border-white/10">
    <a href="/"><img src="/static/white-logo.webp" alt="Vats Apartment" class="h-10 w-auto"></a>
    <span class="text-white/35 text-xs mt-1 block">Admin Panel</span>
  </div>

  <nav class="flex-1 px-3 py-4 space-y-0.5">
    {{$active := .Active}}
    <a href="/admin/dashboard" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm {{if eq $active "dashboard"}}bg-white/15 text-white font-semibold{{else}}text-white/65 hover:bg-white/8 hover:text-white{{end}}">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v5a1 1 0 01-1 1H5a1 1 0 01-1-1V5zm10 0a1 1 0 011-1h4a1 1 0 011 1v3a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 16a1 1 0 011-1h4a1 1 0 011 1v3a1 1 0 01-1 1H5a1 1 0 01-1-1v-3zm10-3a1 1 0 011-1h4a1 1 0 011 1v5a1 1 0 01-1 1h-4a1 1 0 01-1-1v-5z"/></svg>
      Dashboard
    </a>
    <a href="/admin/rooms" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm {{if eq $active "rooms"}}bg-white/15 text-white font-semibold{{else}}text-white/65 hover:bg-white/8 hover:text-white{{end}}">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 10h18M3 14h18M3 7h18M3 17h18M7 3v18"/></svg>
      Rooms
    </a>
    <a href="/admin/tenants" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm {{if eq $active "tenants"}}bg-white/15 text-white font-semibold{{else}}text-white/65 hover:bg-white/8 hover:text-white{{end}}">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197m13.5-9a2.5 2.5 0 11-5 0 2.5 2.5 0 015 0z"/></svg>
      Tenants
    </a>
    <a href="/admin/passes" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm {{if eq $active "passes"}}bg-white/15 text-white font-semibold{{else}}text-white/65 hover:bg-white/8 hover:text-white{{end}}">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      Passes
    </a>
    <a href="/admin/verifications" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm {{if eq $active "verifications"}}bg-white/15 text-white font-semibold{{else}}text-white/65 hover:bg-white/8 hover:text-white{{end}}">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
      Verifications
    </a>
    <a href="/admin/payments" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm {{if eq $active "payments"}}bg-white/15 text-white font-semibold{{else}}text-white/65 hover:bg-white/8 hover:text-white{{end}}">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
      Payments
    </a>
    <a href="/admin/meters" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm {{if eq $active "meters"}}bg-white/15 text-white font-semibold{{else}}text-white/65 hover:bg-white/8 hover:text-white{{end}}">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg>
      Meters
    </a>
    <a href="/admin/blog" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm {{if eq $active "blog"}}bg-white/15 text-white font-semibold{{else}}text-white/65 hover:bg-white/8 hover:text-white{{end}}">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
      Blog
    </a>
    <a href="/admin/api-keys" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm {{if eq $active "api_keys"}}bg-white/15 text-white font-semibold{{else}}text-white/65 hover:bg-white/8 hover:text-white{{end}}">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z"/></svg>
      API Keys
    </a>
  </nav>

  <div class="px-3 py-4 border-t border-white/10 space-y-0.5">
    <a href="/" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-white/50 hover:bg-white/8 hover:text-white">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25"/></svg>
      View Site
    </a>
    <a href="/logout" class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-white/50 hover:bg-white/8 hover:text-red-300">
      <svg class="w-5 h-5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"/></svg>
      Logout
    </a>
  </div>
</aside>

<!-- Mobile header -->
<div class="lg:hidden fixed top-0 left-0 right-0 h-14 bg-primary z-20 flex items-center px-4 gap-3">
  <button onclick="toggleSidebar()" class="text-white/80 hover:text-white p-1" aria-label="Menu">
    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
  </button>
  <a href="/"><img src="/static/white-logo.webp" alt="Vats Apartment" class="h-8 w-auto"></a>
  <span class="text-white/35 text-xs">Admin</span>
</div>

<!-- Main content -->
<main class="lg:ml-64 pt-14 lg:pt-0 min-h-screen">
  <div class="max-w-6xl mx-auto px-4 md:px-6 py-6 lg:py-8">
{{end}}

{{define "admin_footer"}}
  </div>
</main>

<script>
function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('overlay').classList.toggle('show');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('overlay').classList.remove('show');
}
document.querySelectorAll('#sidebar a').forEach(function(a) {
  a.addEventListener('click', function() { closeSidebar(); });
});
</script>
</body>
</html>
{{end}}
