<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{.Post.Title}} — Vats Apartment Blog</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: '#111111',
          'on-primary': '#ffffff',
          secondary: '#546255',
          'on-secondary': '#ffffff',
          'sec-container': '#d7e7d6',
          'on-sec-container': '#5a685b',
          background: '#f9f9f8',
          'on-background': '#1a1c1c',
          surface: '#f9f9f8',
          'on-surface': '#1a1c1c',
          'sf-variant': '#e2e2e2',
          'on-sf-variant': '#444748',
          outline: '#747878',
          'ol-variant': '#c4c7c7',
          'sf-low': '#f3f4f3',
          'sf-high': '#e8e8e7',
          'sf-lowest': '#ffffff',
        }
      }
    }
  }
</script>
<link rel="icon" href="/static/favicon.ico">
<style>
  .blog-content h2 { font-size: 1.25rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.5rem; }
  .blog-content h3 { font-size: 1.1rem; font-weight: 600; margin-top: 1.25rem; margin-bottom: 0.5rem; }
  .blog-content p { margin-bottom: 0.75rem; line-height: 1.7; }
  .blog-content ul { list-style: disc; padding-left: 1.5rem; margin-bottom: 0.75rem; }
  .blog-content ol { list-style: decimal; padding-left: 1.5rem; margin-bottom: 0.75rem; }
  .blog-content li { margin-bottom: 0.25rem; }
  .blog-content strong { font-weight: 600; }
  .blog-content em { font-style: italic; }
  .blog-content a { color: #111; text-decoration: underline; }
  .blog-content img { max-width: 100%; border-radius: 0.5rem; margin: 1rem 0; }
  .blog-content blockquote { border-left: 3px solid #546255; padding-left: 1rem; margin: 1rem 0; color: #444748; font-style: italic; }
  .blog-content code { background: #f3f4f3; padding: 0.15rem 0.4rem; border-radius: 0.25rem; font-size: 0.85em; }
  .blog-content pre { background: #f3f4f3; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 0.75rem; }
</style>
</head>
<body class="bg-background text-on-surface">

<nav class="sticky top-0 z-50 bg-primary shadow-sm border-b border-white/10">
  <div class="max-w-6xl mx-auto px-4 md:px-6 flex items-center justify-between h-24 md:h-28">
    <a href="/" class="flex-shrink-0">
      <img src="/static/white-logo.webp" alt="Vats Apartment" class="h-20 md:h-[120px] w-auto">
    </a>
    <div class="hidden md:flex items-center gap-1">
      <a href="/" class="text-sm text-white/65 hover:text-white px-4 py-2 rounded-lg hover:bg-white/5 font-medium">Home</a>
      <a href="/blog" class="text-sm text-white/65 hover:text-white px-4 py-2 rounded-lg hover:bg-white/5 font-medium">Blog</a>
      <a href="/room-showcase" class="text-sm text-white/65 hover:text-white px-4 py-2 rounded-lg hover:bg-white/5 font-medium">3D Tour</a>
      <a href="/location" class="text-sm text-white/65 hover:text-white px-4 py-2 rounded-lg hover:bg-white/5 font-medium">Location</a>
      <a href="/contact-us" class="text-sm text-white/65 hover:text-white px-4 py-2 rounded-lg hover:bg-white/5 font-medium">Contact</a>
    </div>
    <div class="flex items-center gap-3 md:gap-4">
      <a href="/login" class="text-sm text-white/65 hover:text-white px-3 py-2 rounded-lg hover:bg-white/5 hidden md:inline-flex items-center gap-1.5 font-medium">Login</a>
      <a href="/book-now" class="bg-white text-primary px-5 md:px-7 py-2.5 md:py-3 rounded-lg text-sm font-semibold hover:bg-white/90">Book Now</a>
    </div>
  </div>
</nav>

<main class="max-w-3xl mx-auto px-4 py-8 md:py-12">
  <a href="/blog" class="inline-flex items-center gap-1.5 text-sm text-on-sf-variant hover:text-primary mb-6 transition-colors">
    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    Back to Blog
  </a>

  <article>
    {{if .Post.ImageURL}}
    <img src="{{.Post.ImageURL}}" alt="{{.Post.Title}}" class="w-full h-48 md:h-64 object-cover rounded-lg mb-6">
    {{end}}

    <h1 class="text-2xl md:text-4xl font-bold leading-tight mb-4">{{.Post.Title}}</h1>

    <div class="flex items-center gap-4 text-xs text-on-sf-variant mb-8 pb-6 border-b border-ol-variant">
      <span>{{.Post.Author}}</span>
      <span>·</span>
      <span>{{.Post.CreatedAt}}</span>
    </div>

    <div class="blog-content text-sm md:text-base text-on-surface leading-relaxed">
      {{safeHTML .Post.Content}}
    </div>
  </article>
</main>

<footer class="bg-primary border-t border-white/10 py-12 px-4 mt-16">
  <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
    <div class="flex items-center">
      <img src="/static/white-logo.webp" alt="Vats Apartment" class="h-28 w-auto opacity-90">
    </div>
    <div class="flex gap-4 text-xs text-white/40 uppercase tracking-wider">
      <a href="/privacy" class="hover:text-white underline underline-offset-4 transition-colors">Privacy</a>
      <a href="/terms" class="hover:text-white underline underline-offset-4 transition-colors">Terms</a>
      <a href="/support" class="hover:text-white underline underline-offset-4 transition-colors">Support</a>
    </div>
    <div class="text-xs text-white/30 text-center md:text-right">
      &copy; 2026 Vats Apartment.
    </div>
  </div>
</footer>

</body>
</html>
