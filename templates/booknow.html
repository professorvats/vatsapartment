<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book Your Room — Vats Apartment</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          primary: '#111111',
          'on-primary': '#ffffff',
          secondary: '#546255',
          'on-secondary': '#ffffff',
          'sec-container': '#d7e7d6',
          'on-sec-container': '#5a685b',
          background: '#f9f9f8',
          'on-background': '#1a1c1c',
          surface: '#f9f9f8',
          'on-surface': '#1a1c1c',
          'sf-variant': '#e2e2e2',
          'on-sf-variant': '#444748',
          outline: '#747878',
          'ol-variant': '#c4c7c7',
          'sf-low': '#f3f4f3',
          'sf-high': '#e8e8e7',
          'sf-highest': '#e2e2e2',
          'sf-lowest': '#ffffff',
        }
      }
    }
  }
</script>
<script src="https://unpkg.com/htmx.org@2.0.4"></script>
<link rel="icon" href="/static/favicon.ico">
<!-- Google Tag Manager -->
<script>
window.dataLayer=window.dataLayer||[];
window.dataLayer.push({'gtm.start':new Date().getTime(),event:'gtm.js'});
</script>
<script async src="https://www.googletagmanager.com/gtm.js?id=GTM-P6TDL438"></script>
</head>
<body class="bg-background text-on-surface">
<!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-P6TDL438" height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>

<nav class="sticky top-0 z-50 bg-primary shadow-sm border-b border-white/10">
  <div class="max-w-6xl mx-auto px-4 md:px-6 flex items-center justify-between h-24 md:h-28">
    <a href="/" class="flex-shrink-0">
      <img src="/static/white-logo.webp" alt="Vats Apartment" class="h-20 md:h-[120px] w-auto">
    </a>
    <div class="hidden md:flex items-center gap-1">
      <a href="/" class="text-sm text-white/65 hover:text-white px-4 py-2 rounded-lg hover:bg-white/5 font-medium">Home</a>
      <a href="/blog" class="text-sm text-white/65 hover:text-white px-4 py-2 rounded-lg hover:bg-white/5 font-medium">Blog</a>
      <a href="/room-showcase" class="text-sm text-white/65 hover:text-white px-4 py-2 rounded-lg hover:bg-white/5 font-medium">3D Tour</a>
      <a href="/location" class="text-sm text-white/65 hover:text-white px-4 py-2 rounded-lg hover:bg-white/5 font-medium">Location</a>
      <a href="/contact-us" class="text-sm text-white/65 hover:text-white px-4 py-2 rounded-lg hover:bg-white/5 font-medium">Contact</a>
    </div>
    <div class="flex items-center gap-3 md:gap-4">
      <a href="/login" class="text-sm text-white/65 hover:text-white px-3 py-2 rounded-lg hover:bg-white/5 hidden md:inline-flex items-center gap-1.5 font-medium">Login</a>
      <a href="/book-now" class="bg-white text-primary px-5 md:px-7 py-2.5 md:py-3 rounded-lg text-sm font-semibold hover:bg-white/90">Book Now</a>
    </div>
  </div>
</nav>

<main>
  <div class="max-w-6xl mx-auto px-4 mt-4 mb-6">
    <section class="h-[140px] md:h-[220px] rounded-xl overflow-hidden bg-sf-highest flex items-center justify-center border border-ol-variant">
      <div class="text-center">
        <h1 class="text-2xl md:text-5xl font-bold mb-2 text-on-surface">Book Your Space</h1>
        <p class="text-sm md:text-base text-on-sf-variant">Select your preferred room and starting date.</p>
      </div>
    </section>
  </div>

  <div class="max-w-6xl mx-auto px-4 pb-16">
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-4 md:gap-6 items-start">
      <div class="lg:col-span-7 bg-sf-lowest border border-ol-variant rounded-lg p-4 md:p-6 shadow-sm">
        <h2 class="font-bold text-sm md:text-base mb-4 pb-3 border-b border-ol-variant">Building Layout</h2>
        <div class="flex flex-col gap-3 md:gap-4">
          {{range .Floors}}
          <div>
            <p class="text-xs text-outline mb-2 font-semibold">{{.Label}}</p>
            <div class="grid gap-3 {{if eq (len .Rooms) 1}}grid-cols-1{{else}}grid-cols-2{{end}}">
              {{range .Rooms}}
              <button onclick="selectRoom('{{.ID}}')" id="room-{{.ID}}" class="room-card text-left p-3 md:p-4 rounded-lg border-2 {{if eq .Status "active"}}border-gray-300 opacity-60 cursor-not-allowed{{else}}border-ol-variant hover:border-secondary{{end}} transition-colors relative" {{if eq .Status "active"}}disabled{{end}}>
                <span class="absolute top-2 right-2 text-[10px] md:text-xs font-bold px-2 py-0.5 rounded {{if eq .Status "active"}}bg-sf-high text-on-sf-variant{{else}}bg-sec-container text-on-sec-container{{end}}">{{if eq .Status "active"}}OCCUPIED{{else}}AVAILABLE{{end}}</span>
                <p class="font-bold text-sm md:text-base text-on-surface">{{.ID}}</p>
                <p class="text-xs text-on-sf-variant">{{.Type}}</p>
                <p class="text-xs font-semibold mt-1 text-on-surface">₹{{printf "%.0f" .Price}}/mo</p>
                <p class="text-[10px] text-on-sf-variant">(splitted between roommates)</p>
              </button>
              {{end}}
            </div>
          </div>
          {{end}}
        </div>
      </div>

      <div class="lg:col-span-5 bg-sf-lowest border border-ol-variant rounded-lg p-4 md:p-6 shadow-sm lg:sticky lg:top-24">
        <form id="inquiry-form" onsubmit="return sendInquiry(event)" class="space-y-4">
          <div>
            <label class="block text-xs text-on-sf-variant mb-1 font-semibold uppercase tracking-wider">Selected Room</label>
            <select name="room" id="room-select" class="w-full border border-ol-variant rounded-lg p-3 text-sm bg-sf-low text-on-surface focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" required>
              <option value="" disabled selected>Select a room</option>
              {{range .Rooms}}
              <option value="{{.ID}}">{{.ID}} - {{.Type}} - ₹{{printf "%.0f" .Price}}/month</option>
              {{end}}
            </select>
          </div>
          <div>
            <label class="block text-xs text-on-sf-variant mb-1 font-semibold uppercase tracking-wider">Your Name</label>
            <input type="text" name="name" id="inquiry-name" placeholder="Enter your full name" class="w-full border border-ol-variant rounded-lg p-3 text-sm bg-sf-low text-on-surface placeholder:text-on-sf-variant/40 focus:outline-none focus:ring-2 focus:ring-primary focus:border-transparent" required>
          </div>
          <button type="submit" class="w-full bg-secondary text-on-secondary py-3 rounded-lg font-semibold hover:bg-secondary/90 text-sm transition-colors">Inquire on WhatsApp</button>
          <p class="text-[10px] text-on-sf-variant text-center">Opens WhatsApp to send your inquiry directly.</p>
        </form>
      </div>
    </div>
  </div>
</main>

<footer class="bg-primary border-t border-white/10 py-12 px-4 mt-auto">
  <div class="max-w-6xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
    <div class="flex items-center">
      <img src="/static/white-logo.webp" alt="Vats Apartment" class="h-28 w-auto opacity-90">
    </div>
    <div class="flex gap-4 text-xs text-white/40 uppercase tracking-wider">
      <a href="/privacy" class="hover:text-white underline underline-offset-4 transition-colors">Privacy</a>
      <a href="/terms" class="hover:text-white underline underline-offset-4 transition-colors">Terms</a>
      <a href="/support" class="hover:text-white underline underline-offset-4 transition-colors">Support</a>
    </div>
    <div class="text-xs text-white/30 text-center md:text-right">
      &copy; 2026 Vats Apartment.
    </div>
  </div>
</footer>

<script>
function selectRoom(id) {
  document.querySelectorAll('.room-card').forEach(c => { c.classList.remove('border-secondary','bg-sec-container/30'); });
  const card = document.getElementById('room-'+id);
  if (card) { card.classList.add('border-secondary','bg-sec-container/30'); }
  document.getElementById('room-select').value = id;
}
function sendInquiry(e) {
  e.preventDefault();
  var room = document.getElementById('room-select').value;
  var name = document.getElementById('inquiry-name').value.trim();
  if (!room || !name) return;
  var msg = encodeURIComponent('Hi, I am ' + name + '. I am interested in Room ' + room + ' at Vats Apartment. Please share availability and details.');
  window.dataLayer=window.dataLayer||[];window.dataLayer.push({event:'whatsapp_click',source:'booknow_inquiry'});
  window.open('https://wa.me/919992937447?text=' + msg, '_blank');
}
</script>
</body>
</html>
