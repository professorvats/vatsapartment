{{template "admin_header" .}}
<div class="flex flex-col items-center justify-center py-16 px-4">
  <div class="bg-amber-50 border border-amber-200 rounded-full p-4 mb-4 text-amber-700 shadow-sm">
    <svg class="w-10 h-10" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.75" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
    </svg>
  </div>
  <h2 class="text-xl sm:text-2xl font-bold text-on-surface mb-2 text-center">Something went wrong</h2>
  <p class="text-xs sm:text-sm text-on-sf-variant mb-6 text-center max-w-md leading-relaxed">{{.ErrorMessage}}</p>
  <div class="flex flex-col sm:flex-row gap-3 w-full max-w-xs">
    <a href="javascript:history.back()" class="border border-ol-variant px-5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold text-center hover:bg-sf-low transition-all">Go Back</a>
    <a href="javascript:location.reload()" class="bg-primary text-on-primary px-5 py-2.5 rounded-xl text-xs sm:text-sm font-semibold text-center hover:bg-primary/90 transition-all shadow-sm">Try Again</a>
  </div>
</div>
{{template "admin_footer" .}}
