{{template "admin_header" .}}
<div class="mb-4">
  <a href="/admin/blog" class="inline-flex items-center gap-1.5 text-xs sm:text-sm font-semibold text-on-sf-variant hover:text-primary transition-colors">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
    Back to Blog List
  </a>
</div>

<div class="mb-5 sm:mb-6">
  <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-on-surface">{{.FormTitle}}</h1>
  <p class="text-xs sm:text-sm text-on-sf-variant mt-0.5">Write and publish housing guides, news, and updates</p>
</div>

{{if .Error}}
<div class="bg-red-50 border border-red-200 text-error text-xs sm:text-sm p-4 rounded-2xl mb-6 font-semibold">{{.Error}}</div>
{{end}}

<form method="POST" action="/admin/blog/save" class="space-y-4 max-w-3xl bg-sf-lowest border border-ol-variant rounded-2xl p-4 sm:p-6 shadow-sm">
  {{if .Post}}
  <input type="hidden" name="id" value="{{.Post.ID}}">
  {{end}}

  <div>
    <label class="block text-xs font-bold uppercase tracking-wider text-on-sf-variant mb-1.5">Article Title *</label>
    <input type="text" name="title" value="{{if .Post}}{{.Post.Title}}{{end}}" required
      class="w-full border border-ol-variant rounded-xl px-4 py-2.5 text-sm bg-sf-lowest focus:border-primary focus:ring-2 focus:ring-primary/20 font-medium">
  </div>

  <div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5">
    <div>
      <label class="block text-xs font-bold uppercase tracking-wider text-on-sf-variant mb-1.5">URL Slug</label>
      <input type="text" name="slug" value="{{if .Post}}{{.Post.Slug}}{{end}}" placeholder="auto-generated-from-title"
        class="w-full border border-ol-variant rounded-xl px-4 py-2.5 text-sm bg-sf-lowest focus:border-primary focus:ring-2 focus:ring-primary/20 font-mono text-xs">
    </div>
    <div>
      <label class="block text-xs font-bold uppercase tracking-wider text-on-sf-variant mb-1.5">Publish Status</label>
      <select name="status" class="w-full border border-ol-variant rounded-xl px-4 py-2.5 text-sm bg-sf-lowest focus:border-primary focus:ring-2 focus:ring-primary/20 font-semibold">
        <option value="draft" {{if .Post}}{{if eq .Post.Status "draft"}}selected{{end}}{{end}}>Draft</option>
        <option value="published" {{if .Post}}{{if eq .Post.Status "published"}}selected{{end}}{{end}}>Published</option>
      </select>
    </div>
  </div>

  <div>
    <label class="block text-xs font-bold uppercase tracking-wider text-on-sf-variant mb-1.5">Excerpt (Meta Description)</label>
    <textarea name="excerpt" rows="2" placeholder="Brief summary shown in Google search & listings..."
      class="w-full border border-ol-variant rounded-xl px-4 py-2.5 text-sm bg-sf-lowest focus:border-primary focus:ring-2 focus:ring-primary/20">{{if .Post}}{{.Post.Excerpt}}{{end}}</textarea>
  </div>

  <div>
    <label class="block text-xs font-bold uppercase tracking-wider text-on-sf-variant mb-1.5">Content * (HTML supported)</label>
    <textarea name="content" rows="12" required placeholder="<p>Write your article content here...</p>"
      class="w-full border border-ol-variant rounded-xl px-4 py-2.5 text-sm bg-sf-lowest focus:border-primary focus:ring-2 focus:ring-primary/20 font-mono text-xs">{{if .Post}}{{.Post.Content}}{{end}}</textarea>
  </div>

  <div>
    <label class="block text-xs font-bold uppercase tracking-wider text-on-sf-variant mb-1.5">Cover Image URL</label>
    <input type="text" name="image_url" value="{{if .Post}}{{.Post.ImageURL}}{{end}}" placeholder="https://..."
      class="w-full border border-ol-variant rounded-xl px-4 py-2.5 text-sm bg-sf-lowest focus:border-primary focus:ring-2 focus:ring-primary/20">
  </div>

  <div class="flex flex-col sm:flex-row gap-2.5 pt-3 border-t border-ol-variant/60">
    <button type="submit" class="bg-primary text-on-primary px-6 py-2.5 rounded-xl text-sm font-semibold hover:bg-primary/90 active:scale-[0.98] transition-all flex items-center justify-center gap-1.5">
      Save Post
    </button>
    <a href="/admin/blog" class="border border-ol-variant text-on-surface px-6 py-2.5 rounded-xl text-sm font-semibold hover:bg-sf-low text-center">
      Cancel
    </a>
  </div>
</form>
{{template "admin_footer" .}}
