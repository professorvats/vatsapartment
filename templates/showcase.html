<script type="module">
import * as THREE from 'three';

const container = document.getElementById('viewer');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(65, container.clientWidth/container.clientHeight, 0.1, 1000);
camera.position.set(0, 0, 0.1);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(container.clientWidth, container.clientHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.prepend(renderer.domElement);
renderer.domElement.style.position = 'absolute';
renderer.domElement.style.top = '0';
renderer.domElement.style.left = '0';

const geom = new THREE.SphereGeometry(50, 64, 32);
const mat = new THREE.MeshBasicMaterial({side: THREE.BackSide});
const sphere = new THREE.Mesh(geom, mat);
scene.add(sphere);

new THREE.TextureLoader().load('/static/photo360.webp', tex => {
  mat.map = tex; mat.needsUpdate = true;
  document.getElementById('loading').style.display = 'none';
});

let lon = 0, lat = 0, isDown = false, px = 0, py = 0, plon = 0, plat = 0, fov = 65;

container.addEventListener('pointerdown', e => { isDown = true; px = e.clientX; py = e.clientY; plon = lon; plat = lat; });
container.addEventListener('pointermove', e => { if(!isDown) return; lon = (px - e.clientX)*0.15 + plon; lat = (e.clientY - py)*0.15 + plat; lat = Math.max(-85, Math.min(85, lat)); });
container.addEventListener('pointerup', () => { isDown = false; });
container.addEventListener('wheel', e => { e.preventDefault(); fov = Math.max(30, Math.min(100, fov + e.deltaY*0.05)); }, {passive:false});

(function anim() {
  requestAnimationFrame(anim);
  if (!isDown) lon += 0.03;
  camera.fov += (fov - camera.fov)*0.2;
  camera.updateProjectionMatrix();
  const phi = THREE.MathUtils.degToRad(90 - lat);
  const theta = THREE.MathUtils.degToRad(lon);
  camera.lookAt(50*Math.sin(phi)*Math.cos(theta), 50*Math.cos(phi), 50*Math.sin(phi)*Math.sin(theta));
  renderer.render(scene, camera);
})();

window.addEventListener('resize', () => {
  const w = container.clientWidth;
  const h = container.clientHeight;
  camera.aspect = w/h;
  camera.updateProjectionMatrix();
  renderer.setSize(w, h);
});
</script>
