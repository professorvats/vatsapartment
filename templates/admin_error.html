{{template "admin_header" .}}
<div class="flex flex-col items-center justify-center py-16">
  <div class="bg-amber-50 border border-amber-200 rounded-full p-3 mb-4">
    <svg class="w-8 h-8 text-warning" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/>
    </svg>
  </div>
  <h2 class="text-xl font-bold text-on-surface mb-2">Something went wrong</h2>
  <p class="text-on-sf-variant mb-6 text-center max-w-md">{{.ErrorMessage}}</p>
  <div class="flex gap-3">
    <a href="javascript:history.back()" class="border border-ol-variant px-4 py-2 rounded-lg text-sm hover:bg-sf-low">Go Back</a>
    <a href="javascript:location.reload()" class="bg-primary text-on-primary px-4 py-2 rounded-lg text-sm font-semibold">Try Again</a>
  </div>
</div>
{{template "admin_footer" .}}
