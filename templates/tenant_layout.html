{{define "tenant_header"}}<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tenant Portal — Vats Apartment</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: { extend: { colors: {
      primary: '#111111', 'on-primary': '#ffffff', secondary: '#546255',
      background: '#f9f9f8', 'on-surface': '#1a1c1c', 'sf-variant': '#e2e2e2',
      'on-sf-variant': '#444748', outline: '#747878', 'ol-variant': '#c4c7c7',
      'sf-low': '#f3f4f3', 'sf-lowest': '#ffffff', error: '#ba1a1a',
      success: '#2d6a2e', warning: '#b8860b',
    }}}
  }
</script>
<link rel="icon" href="/static/favicon.ico">
<style>
  .bottom-nav a.active { color: #111111; font-weight: 600; }
  .bottom-nav a.active svg { stroke: #111111; }
</style>
</head>
<body class="bg-background text-on-surface min-h-screen pb-20">

<!-- Top Bar -->
<div class="sticky top-0 z-20 bg-primary text-white px-4 py-3 flex items-center justify-between">
  <div class="flex items-center gap-2">
    <img src="/static/white-logo.webp" alt="Vats Apartment" class="h-8 w-auto">
    <span class="text-white/50 text-xs">| Tenant</span>
  </div>
  <a href="/tenant/logout" class="text-white/60 hover:text-white text-sm flex items-center gap-1">
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
    Logout
  </a>
</div>

{{if .Error}}
<div class="mx-4 mt-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm">{{.Error}}</div>
{{end}}
{{if .Msg}}
<div class="mx-4 mt-4 p-3 bg-green-50 border border-green-200 text-green-700 rounded-lg text-sm">{{.Msg}}</div>
{{end}}

<main class="max-w-2xl mx-auto px-4 py-4">
{{end}}

{{define "tenant_footer"}}
</main>

<!-- Bottom Navigation -->
<nav class="bottom-nav fixed bottom-0 left-0 right-0 bg-sf-lowest border-t border-ol-variant z-20 flex items-center justify-around px-2 py-2">
  {{$active := .Active}}
  <a href="/tenant/dashboard" class="flex flex-col items-center gap-0.5 px-3 py-1 text-xs {{if eq $active "dashboard"}}active{{end}} text-on-sf-variant">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
    Dashboard
  </a>
  <a href="/tenant/payments" class="flex flex-col items-center gap-0.5 px-3 py-1 text-xs {{if eq $active "payments"}}active{{end}} text-on-sf-variant">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    Payments
  </a>
  <a href="/tenant/dashboard#verification" class="flex flex-col items-center gap-0.5 px-3 py-1 text-xs text-on-sf-variant">
    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
    Verify
  </a>
</nav>

<script>
// Auto-hide success/error messages after 5s
document.addEventListener('DOMContentLoaded', function() {
  document.querySelectorAll('.bg-red-50, .bg-green-50').forEach(function(el) {
    setTimeout(function() { el.style.display = 'none'; }, 5000);
  });
});
</script>
</body>
</html>
{{end}}
